name: Daily Autonomous Job Agent Run

on:
  schedule:
    # 22:00 UTC scales precisely to 06:00 AM Singapore Time
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub UI

jobs:
  run-agent-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Increased execution limit to 60 minutes to prevent premature cancellation

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Architecture Library Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas python-jobspy pypdf markdownify requests regex

      - name: Execute Rotating Cloud Scraper Matcher
        run: |
          python scraper_cloud.py

      - name: Execute Incremental Parallel LLM Evaluator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python evaluator_cloud.py

      - name: Commit & Save Updated Cache State Files Trackers
        run: |
          git config --global user.name "Automated Cloud Job Agent"
          git config --global user.email "jobagent-bot@github.com"
          git add schedule_tracker.json scraped_jobs_v3.csv evaluated_cache.json
          git diff-index --quiet HEAD || git commit -m "Sync daily rotation trackers and historical evaluated caches [skip ci]"
          git push
