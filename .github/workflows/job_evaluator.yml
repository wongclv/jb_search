name: Job Evaluation Pipeline

on:
  schedule:
    # Runs daily at 06:30 AM SGT (22:30 UTC) - staggered 30 mins after scraper
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  evaluate-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Run Job Evaluation Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          ALERT_RECIPIENT_EMAIL: "callcentre.wong@gmail.com"
        run: |
          python evaluator_cloud.py

      - name: Commit Updated Evaluation Progress Cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add evaluator_progress.json || true

          if ! git diff --cached --quiet; then
            git commit -m "auto: update evaluation cache [skip ci]"
          fi

          git pull --rebase --autostash origin main
          git push origin main
