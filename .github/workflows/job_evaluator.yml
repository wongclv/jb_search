name: Job Evaluation Pipeline

on:
  schedule:
    # Runs automatically every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Enables manual execution from the Actions tab

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  evaluate-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Run Job Evaluation Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          ALERT_RECIPIENT_EMAIL: "callcentre.wong@gmail.com"
        run: |
          python evaluator_cloud.py

      - name: Commit Updated Evaluation Progress Cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add evaluator_progress.json evaluation_report.json || true
          git commit -m "auto: update evaluation cache [skip ci]" || true
          git push || true

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation_report.json
