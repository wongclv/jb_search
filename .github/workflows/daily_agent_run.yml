name: Daily AI Job Hunter Workflow

on:
  schedule:
    # Runs at 06:00 AM Singapore Time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas python-jobspy pypdf markdownify requests regex

      - name: Run Job Scraper
        run: |
          python scraper_cloud.py

      - name: Execute Incremental Parallel LLM Evaluator & Mailgun Digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python evaluator_cloud.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Automated Cloud Job Agent"
          git config --global user.email "jobagent-bot@github.com"
          git add schedule_tracker.json scraped_jobs_v3.csv evaluated_cache.json evaluation_report.json evaluator_progress.json || true
          git diff-index --quiet HEAD || git commit -m "Update daily job search results and progress trackers [skip ci]"
          git push
