name: Daily AI Job Hunter Workflow

on:
  schedule:
    # 22:00 UTC = 06:00 SGT next morning
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-jobspy

      - name: Execute Executive Job Scraper
        run: python scraper_cloud.py

      - name: Execute AI Evaluation Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          RECIPIENT_EMAIL: "callcentre.wong@gmail.com"
        run: python evaluator_cloud.py

      - name: Persist Data & Commit Progress Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_jobs_v3.csv evaluator_progress.json evaluation_report.json || true
          git commit -m "auto: update daily job search results [skip ci]" || true
          git push || true
