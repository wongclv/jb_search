name: Daily AI Job Hunter Workflow

on:
  schedule:
    # 22:00 UTC = 6:00 AM SGT | 10:00 UTC = 6:00 PM SGT
    - cron: '0 10,22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-jobspy groq
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate Master Titles JSON
        run: |
          python generator.py

      - name: Run Job Scraper
        run: |
          python scraper.py || python scraper_cloud.py

      - name: Execute Incremental Parallel LLM Evaluator & Mailgun Digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python evaluator_cloud.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Automated daily scrape and evaluation update [skip ci]"
          git push
