name: Daily Autonomous Executive Job Pipeline

on:
  schedule:
    # Runs daily at 06:00 SGT (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  run-agent-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Board Scraper
        run: python scraper_cloud.py

      - name: Run Groq AI Evaluator & Dispatch Email Digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python evaluator_cloud.py

      - name: Commit Updated Evaluation Progress Cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add evaluator_progress.json scraped_jobs.json || true
          git commit -m "auto: update evaluation cache [skip ci]" || true
          git push || true
