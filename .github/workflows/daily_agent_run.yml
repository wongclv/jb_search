name: Daily AI Job Hunter Workflow

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Run Job Scraper
        run: |
          # If you have a main scraper script, execute it here (e.g., python scraper.py)
          echo "Running Job Scraper..."

      - name: Execute Incremental Parallel LLM Evaluator & Mailgun Digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          ALERT_RECIPIENT_EMAIL: "callcentre.wong@gmail.com"
        run: |
          python evaluator_cloud.py

      - name: Commit and Push Changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update job evaluation report [skip ci]"
          git push || echo "No changes to commit or push."
